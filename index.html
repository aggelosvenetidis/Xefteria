<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11112b">
<title>Ξεφτέρια · Μονομαχία γνώσεων</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#11112b;--card:#1c1c42;--card2:#262657;--line:#34346e;--tx:#f2f1ff;--mut:#a7a6d6;--acc:#ffc145;--me:#4cc9f0;--op:#ff6b9d;--ok:#35d49a;--bad:#ff5c6c}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(900px 500px at 50% -10%,#2a2470 0%,transparent 60%),var(--bg);color:var(--tx);font:500 16px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding:14px 16px 40px;min-height:100vh}
#top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{font-weight:800;letter-spacing:.5px;font-size:20px}.logo span{color:var(--acc)}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.chip.on{color:var(--ok);border-color:#1f6b55}.chip.off{color:var(--acc)}
#stage{opacity:0;transform:translateY(8px)}#stage.in{opacity:1;transform:none;transition:opacity .25s,transform .25s}
h1{font-size:38px;line-height:1.05;font-weight:800;letter-spacing:-1px}h1 em{font-style:normal;color:var(--acc)}
.hero{margin:10px 0 22px}.hero p{color:var(--mut);margin-top:10px;font-size:14px}
.fld{display:block;margin-bottom:14px}.fld>span{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
input{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;outline:none}
input:focus{border-color:var(--acc)}
.seg{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 4px;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer}
.seg button.act{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--acc)}
.btn{display:block;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px;font-weight:800;cursor:pointer;margin-bottom:10px;transition:transform .08s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#231a00}
.btn.ghost{background:transparent;color:var(--mut)}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;margin:0 0 0 8px;font-size:13px}
.join{display:flex;gap:8px;margin-bottom:10px}.join input{flex:1;text-align:center;letter-spacing:6px;font-weight:800;text-transform:uppercase}.join .btn{width:110px;margin:0}
.msg{min-height:20px;color:var(--acc);font-size:14px;margin-bottom:8px}
.hint{color:var(--mut);font-size:14px;margin:10px 0;text-align:center}
.how{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.how>b{display:block;margin-bottom:8px}.how div{display:flex;gap:10px;font-size:13.5px;color:var(--mut);padding:5px 0}.how i{font-style:normal}.how span b{color:var(--tx)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);text-align:center;margin-bottom:8px}
.code{font-size:64px;font-weight:800;letter-spacing:12px;text-align:center;margin:4px 0 14px;padding-left:12px}
.row{display:flex;gap:8px}.row .btn{font-size:13.5px;padding:12px 6px}
.cpy{margin-bottom:10px;font-size:13px}
.vs{display:flex;align-items:center;gap:10px;margin:16px 0 18px}.vs>span{font-weight:800;color:var(--mut)}
.who{flex:1;background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;border:1.5px solid var(--me);overflow:hidden}
.who.op{border-color:var(--op)}.who.empty{border-style:dashed;border-color:var(--line);color:var(--mut)}
.who b{display:block;font-size:17px;overflow-wrap:anywhere}.who small{color:var(--mut);font-size:12px}
#hud{display:flex;align-items:stretch;gap:8px;margin-bottom:16px}
#hud[hidden]{display:none}
.pl{flex:1;min-width:0;background:var(--card);border-radius:14px;padding:8px 12px;border-bottom:3px solid var(--me)}
.pl.op{border-color:var(--op);text-align:right}.pl.solo{border-color:var(--line);opacity:.6}
.pl .nm{display:block;font-size:12px;font-weight:700;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sc{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 2px}
.mid small{font-size:11px;color:var(--mut);font-weight:700;white-space:nowrap}.mid b{font-size:20px;font-weight:800}.mid i{font-style:normal;color:var(--mut);font-size:14px}
.intro{text-align:center;padding:40px 0}.intro .big{font-size:64px}.intro h2{font-size:34px;font-weight:800;margin-bottom:10px}.intro p{color:var(--mut)}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:700}
.cat{background:var(--card2);padding:5px 11px;border-radius:99px}.val{color:var(--acc)}
.tbar{height:6px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:16px}
.tbar i{display:block;height:100%;background:var(--acc);transform-origin:left;transition:transform .1s linear}.tbar i.low{background:var(--bad)}
.q{font-size:21px;font-weight:800;line-height:1.3;margin-bottom:18px;min-height:82px}
.opts{display:grid;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;font-weight:700;min-height:54px}
.opt b{flex:none;width:28px;height:28px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-size:13px;color:var(--acc)}
.opt span{overflow-wrap:anywhere}
.opt:disabled{cursor:default}.opt.gone{opacity:.25}
.opt.sel{border-color:var(--me);box-shadow:0 0 0 2px rgba(76,201,240,.25)}
.opt.ok{border-color:var(--ok);background:rgba(53,212,154,.16)}.opt.bad{border-color:var(--bad);background:rgba(255,92,108,.16)}
.tag{position:absolute;right:10px;top:-10px;font-style:normal;font-size:11px;font-weight:800;background:var(--op);color:#2b0013;border-radius:99px;padding:2px 8px}
.ll{display:flex;gap:8px;align-items:center;margin-top:14px}
.ll button{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:7px 13px;font-size:13px;font-weight:800;cursor:pointer}
.ll button:disabled{opacity:.35;cursor:default}.ll button.on{opacity:1;border-color:var(--acc);color:var(--acc)}
.streak{margin-left:auto;font-size:13px;font-weight:700;color:var(--acc)}
.note{min-height:48px;margin-top:14px;text-align:center;font-weight:700}
.note .pos{color:var(--ok)}.note .neg{color:var(--bad)}.note .sep{margin:0 8px;color:var(--mut)}.note small{color:var(--mut)}
.wait{color:var(--mut);animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.4}}
.gone{margin-top:8px;font-size:14px;color:var(--acc)}
.cats{display:grid;gap:10px}.cat-b{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;font-size:18px;text-align:left}
.cat-b i{font-style:normal;font-size:28px}.cat-b.sel{border-color:var(--acc);background:var(--card2)}.cat-b:disabled{cursor:default}
.picks{display:flex;gap:10px;margin-top:14px}.picks>div{flex:1;background:var(--card);border-radius:16px;padding:18px 8px;border:1.5px solid var(--me)}.picks .op{border-color:var(--op)}
.picks i{font-style:normal;font-size:34px;display:block}.picks b{display:block;margin:6px 0 2px}.picks small{color:var(--mut)}
.betcat{text-align:center;margin:6px 0 18px}.betcat i{font-style:normal;font-size:44px;display:block}.betcat b{font-size:24px}
.bets{display:flex;gap:10px}.bet{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px 0;font-size:24px;font-weight:800;cursor:pointer}
.bet:nth-child(3){border-color:var(--acc);color:var(--acc)}
.end{text-align:center}.end h2{font-size:32px;font-weight:800;margin:14px 0}.end.win h2{color:var(--acc)}
.final{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:18px}.final b{display:block;font-size:46px;font-weight:800;line-height:1}
.final .me b{color:var(--me)}.final .op b{color:var(--op)}.final small{color:var(--mut);font-weight:700}.final span{font-size:30px;color:var(--mut)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--mut);font-size:12px}.tbl tr:last-child td{border:0}.tbl .best{color:var(--ok);font-weight:800}
#endact{margin-top:16px;text-align:left}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top"><div class="logo">ΞΕΦ<span>ΤΕΡΙΑ</span></div><div id="net" class="chip">Σύνδεση…</div></header>
  <div id="hud" hidden></div>
  <main id="stage"></main>
</div>
<script src="questions.js"></script>
<script src="game.js"></script>
</body>
</html>
